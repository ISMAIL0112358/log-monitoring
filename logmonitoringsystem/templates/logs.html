<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Logs</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #logs { max-height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; }
        .log-entry { padding: 5px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>Live Logs</h2>
    <div id="logs"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const logsContainer = document.getElementById("logs");

            // Fetch initial logs from API
            fetch("/get-logs/")
                .then(response => response.json())
                .then(data => {
                    if (data.logs) {
                        data.logs.split("\n").forEach(log => {
                            if (log.trim()) appendLog(log);
                        });
                    }
                })
                .catch(error => console.error("Error fetching logs: ", error));

            // Function to append logs
            function appendLog(message) {
                const div = document.createElement("div");
                div.className = "log-entry";
                div.textContent = message;
                logsContainer.appendChild(div);
                logsContainer.scrollTop = logsContainer.scrollHeight; // Auto-scroll to bottom
            }

            // Setup WebSocket connection
            const socket = new WebSocket("ws://localhost:8000/ws/get-logs/");

            socket.onopen = function () {
                console.log("WebSocket connected!");
            };

            socket.onmessage = function (event) {
                const data = JSON.parse(event.data);
                if (data.log) appendLog(data.log); // Append new log entry
            };

            socket.onerror = function (error) {
                console.error("WebSocket Error: ", error);
            };

            socket.onclose = function () {
                console.warn("WebSocket Disconnected.");
            };
        });
    </script>
</body>
</html>
